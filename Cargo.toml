[package]
name = "ferroedit"
version = "0.1.7"
edition = "2021"
rust-version = "1.75"
description = "A modern desktop-like text editor that happens to run in a terminal"
license = "MIT"
repository = "https://github.com/korkholeh/ferroedit"
readme = "README.md"
build = "build.rs"
# The grammars baked into the dump by `build.rs` (ADR-022).
include = ["src/**/*", "assets/**/*", "build.rs", "Cargo.toml", "README.md", "LICENSE*"]
keywords = ["editor", "tui", "terminal", "text-editor"]
categories = ["text-editors", "command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
ropey = "1.6"
unicode-segmentation = "1.12"
unicode-width = "0.2"
# `regex-fancy` swaps C oniguruma for pure-Rust fancy-regex, which is what keeps
# static musl builds working (ADR-003). The runtime needs nothing else: the
# grammars arrive as the dump `build.rs` writes, so syntect's own bundled
# assets — and the YAML and plist loaders that build them — would be a second
# copy of ~2 MB in the binary (ADR-022).
syntect = { version = "5.2", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
# The settings file is JSON (`~/.config/ferroedit/config.json`): a path and a
# format a user can guess, on every platform the editor runs on.
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
arboard = { version = "3", optional = true }
# The filesystem watcher (ADR-040). Pinned below 8.x by the MSRV, and taken
# with default features: on Linux that is the pure-Rust `inotify` crate, so a
# static musl build is unaffected (ADR-003); the C `fsevent-sys` it links on
# macOS is not in any release target.
notify = "7"
# Legacy encodings (ADR-059). Pure Rust, so a static musl build is unaffected
# (ADR-003), and taken without `simd-accel` — which needs nightly — or any of
# the `fast-*-encode` tables, which trade ~150 KB of binary each for encode
# speed on scripts a text editor writes a few kilobytes of at a time.
encoding_rs = { version = "0.8.40", default-features = false, features = ["alloc"] }

# Gzip on the way in (ADR-074). Already in the tree under syntect, which reads
# the grammar dump through it, so the runtime cost of opening a `.sql.gz` is a
# `use` and not a dependency. `default-features = false` with `rust_backend`
# names the pure-Rust `miniz_oxide` explicitly rather than by default, so no
# later default can pull in a C zlib and break a static musl build (ADR-003).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
# Both are already in the tree under crossterm, so taking them directly costs
# nothing to build. They are what lets a killed editor put the terminal back
# instead of leaving raw mode behind for every run after it (ADR-073).
signal-hook = "0.3"
libc = "0.2"

[build-dependencies]
# Same features as the runtime dependency: the dump `build.rs` writes has to be
# readable by the parser the binary links against.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
insta = "1"
tempfile = "3"

[features]
default = []
# Native system clipboard. Off by default: pulls X11/Wayland libs on Linux,
# breaks the pure-static goal, and is useless over SSH (ADR-005).
native-clipboard = ["dep:arboard"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No panic = "abort": unwinding keeps TerminalGuard::drop running, which is the
# second half of the terminal-restore safety net (ADR-006).
